<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily expense summary</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 0;">
    <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
            <tr><td style="background:#973ae6;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:bold;">Money Manager</td></tr>
            <tr><td style="padding:28px;color:#374151;font-size:15px;line-height:1.6;">
                <p style="margin:0 0 12px;">Hi <b th:text="${name}">User</b>,</p>
                <p style="margin:0 0 20px;">Here is your expense summary for today:</p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fef2f2;border-radius:10px;margin-bottom:24px;">
                    <tr><td style="padding:16px 20px;">
                        <div style="font-size:12px;color:#991b1b;text-transform:uppercase;letter-spacing:0.5px;">Total spent today</div>
                        <div style="font-size:26px;font-weight:bold;color:#991b1b;margin-top:4px;">&#8377;<span th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">0.00</span></div>
                    </td></tr>
                </table>

                <div style="overflow-x:auto;">
                    <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:13px;">
                        <tr style="background:#f9fafb;">
                            <th align="left" style="padding:10px 8px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">#</th>
                            <th align="left" style="padding:10px 8px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">Name</th>
                            <th align="left" style="padding:10px 8px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">Category</th>
                            <th align="left" style="padding:10px 8px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">Date</th>
                            <th align="right" style="padding:10px 8px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">Amount</th>
                        </tr>
                        <tr th:each="e, stat : ${expenses}">
                            <td style="padding:10px 8px;border-bottom:1px solid #f3f4f6;color:#9ca3af;" th:text="${stat.count}">1</td>
                            <td style="padding:10px 8px;border-bottom:1px solid #f3f4f6;color:#111827;" th:text="${e.name}">Lunch</td>
                            <td style="padding:10px 8px;border-bottom:1px solid #f3f4f6;color:#6b7280;" th:text="${e.categoryName}">Food</td>
                            <td style="padding:10px 8px;border-bottom:1px solid #f3f4f6;color:#6b7280;white-space:nowrap;" th:text="${#temporals.format(e.date, 'dd MMM yyyy')}">14 Oct 2026</td>
                            <td align="right" style="padding:10px 8px;border-bottom:1px solid #f3f4f6;color:#991b1b;font-weight:600;white-space:nowrap;">&#8377;<span th:text="${#numbers.formatDecimal(e.amount, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
                        </tr>
                    </table>
                </div>

                <p style="margin:24px 0 0;">Best regards,<br>Money Manager Team</p>
            </td></tr>
            <tr><td style="background:#f9fafb;padding:16px 28px;font-size:12px;color:#9ca3af;text-align:center;">You're receiving this daily summary from Money Manager.</td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
